version: 0.2

# Set these env vars in your CodeBuild project settings (Environment section):
#   NEXT_PUBLIC_CONTACT_API_URL      – API Gateway URL from `sam deploy`
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY   – Cloudflare Turnstile public site key

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci

  build:
    commands:
      - echo "Running prebuild (image optimization)..."
      - npm run setup          # generates public/imgs/optimized/*.webp  (skips if already present)
      - echo "Building Next.js static export..."
      - npm run build          # outputs to ./out

  post_build:
    commands:
      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id E17887MOK62LAS --paths "/*"
      - echo "Deploy complete."

artifacts:
  files:
    - '**/*'
  discard-paths: no
  base-directory: out

cache:
  paths:
    - 'node_modules/**/*'
    - 'public/imgs/optimized/**/*'   # cache generated WebP files between builds
